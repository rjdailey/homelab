---
services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Sets the listening port for the application. Defaults to 8083.
      # - CWA_PORT_OVERRIDE=8083
      # If your library is on a network share (e.g., NFS/SMB), disables WAL and chown to reduce permission issues,
      # and switches file watching to polling (more reliable on network mounts) instead of inotify.
      - NETWORK_SHARE_MODE=false
      # If you want to force polling mode regardless of share type, set CWA_WATCH_MODE=poll
      # - CWA_WATCH_MODE=poll
      # If running behind multiple proxies (e.g., Cloudflare Tunnel + reverse proxy), set the total number of proxies
      # This ensures proper IP detection for session protection and rate limiting (default: 1)
      # - TRUSTED_PROXY_COUNT=2
      # Skip the automatic library detection/mount at startup. When enabled, the auto-library service will not run.
      # Accepts: true/yes/1 to disable auto-mount (default: false)
      # - DISABLE_LIBRARY_AUTOMOUNT=false
    env_file:
      - .env
    volumes:
      - /opt/appdata/calibre-web-automated:/config
      # This is an ingest dir, NOT a library one.
      # Anything added here will be automatically added to your library.
      # All files placed here are REMOVED AFTER PROCESSING
      - /mnt/nas/data/torrents/books:/cwa-book-ingest
      # If you don't have an existing library, CWA will automatically create one at the bind provided here
      - /opt/appdata/calibre-web-automated/library:/calibre-library
      - /mnt/nas/data/media/books:/books
    ports:
      # Change the first number to change the port you want to access the Web UI, not the second
      - 8083:8083
    # If you set CWA_PORT_OVERRIDE to a port below 1024, you may need to uncomment the following line:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
    networks: [proxy]

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - 8082:8084
    restart: unless-stopped
    volumes:
      - /mnt/nas/data/torrents/books:/books # Default destination for book downloads
      - /mnt/nas/data/media/audiobooks:/audiobooks
      - /opt/appdata/shelfmark:/config # App configuration
      # Required for torrent / usenet - path must match your download client's volume exactly
      - /mnt/nas/data/torrents:/downloads
      - /opt/appdata/calibre-web-automated/library:/calibre-library:ro
    networks: [proxy]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - /opt/appdata/audiobookshelf:/config
      - /opt/appdata/audiobookshelf/metadata:/metadata
      - /mnt/nas/data/media/audiobooks:/audiobooks
      - /mnt/nas/data/media/podcasts:/podcasts
    environment:
      - TZ=America/Chicago
    restart: unless-stopped
    networks: [proxy]

networks:
  proxy:
    external: true
