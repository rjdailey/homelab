services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=latest
    volumes:
      - /opt/appdata/plex:/config
      - /mnt/nas/data/media:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "32400:32400"      # main web UI / remote access
      - "1900:1900/udp"    # DLNA
      # GDM network discovery
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    restart: unless-stopped
    networks: [proxy]

  plexautolanguages:
    cap_drop:
      - ALL
    image: journeyover/plex-auto-languages:latest
    container_name: palang
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PLEX_URL=http://192.168.1.35:32400/
    env_file:
      - .env
    volumes:
      - /opt/appdata/plexautolanguages:/config
    restart: unless-stopped

networks:
  proxy:
    external: true
