name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      changed_stacks: ${{ steps.changed.outputs.stacks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed stacks
        id: changed
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            STACKS=$(ls stacks/ | tr '\n' ' ')
          else
            STACKS=$(git diff --name-only ${{ github.event.before }} HEAD \
              | grep '^stacks/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          fi
          echo "stacks=$STACKS" >> $GITHUB_OUTPUT
          echo "Changed stacks: $STACKS"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, truthy: {allowed-values: ['true', 'false']}, document-start: disable}}" \
            stacks/

      - name: Create dummy env files
        run: |
          for stack in stacks/*/; do
            if [ -f "$stack/compose.yaml" ]; then
              touch "$stack/.env"
            fi
          done

      - name: Validate compose files
        run: |
          for stack in stacks/*/; do
            if [ -f "$stack/compose.yaml" ]; then
              echo "Validating $stack..."
              docker compose -f "$stack/compose.yaml" config --quiet
            fi
          done

      - name: Run KICS scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/path \
            checkmarx/kics:latest scan \
            -p /path/stacks \
            -t DockerCompose \
            --config /path/.kics.config \
            --no-progress \
            --fail-on high,critical

  deploy:
    needs: validate
    runs-on: self-hosted
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.validate.outputs.changed_stacks != ''

    steps:
      - name: Deploy changed stacks
        shell: bash
        env:
          CHANGED_STACKS: ${{ needs.validate.outputs.changed_stacks }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          komodo_request() {
            curl --fail --silent --show-error --max-time 15 \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              --data "$2" "http://localhost:9120/$1"
          }

          deploy_stack() {
            local stack=$1 response update_id status request deadline
            echo "Deploying $stack..."
            response=$(komodo_request execute/DeployStack "$(jq -nc --arg stack "$stack" '{stack: $stack}')") ||
              return 1
            update_id=$(jq -er '._id["$oid"] | select(type == "string" and length > 0)' <<< "$response") ||
              return 1
            echo "Komodo update ID for $stack is $update_id"
            request=$(jq -nc --arg id "$update_id" '{id: $id}')
            deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              response=$(komodo_request read/GetUpdate "$request") || return 1
              status=$(jq -er '.status' <<< "$response") || return 1
              case "$status" in
                Complete)
                  jq -e '.success == true' <<< "$response" >/dev/null
                  return $?
                  ;;
                Queued|InProgress) sleep 5 ;;
                *) echo "Unexpected Komodo status for $stack: $status"; return 1 ;;
              esac
            done
            echo "Timed out waiting for the Komodo deployment of $stack"
            return 1
          }

          failed=0
          read -r -a stacks <<< "$CHANGED_STACKS"
          for stack in "${stacks[@]}"; do
            if deploy_stack "$stack"; then
              echo "Deployed $stack"
            else
              echo "::error::Deployment of $stack failed. Check the update in Komodo."
              failed=1
            fi
          done
          exit "$failed"
